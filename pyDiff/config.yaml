simulation:
  steps: 100000        # Steps for main MSD run
  walkers: 100
  trials: 20        # Parallel trials for MSD
  dt: 0.0001
  step_size: 0.001

grid:
  size: 2000           # Resolution (size x size)
  min: -1.0
  max: 1.0            # Grid extends from min to max

boundaries:
  pbc: false          # Use Periodic Boundary Conditions?
  check_bounds: true # Check if walkers leave grid? (Ignored if pbc is true)

disorder:
  # Type must be one of the keys in AVAILABLE_DISORDER_FUNCTIONS in the script
  # e.g., none, gaussian, uniform, plateau, gaussian_per_trial , uniform_per_trial etc.
  type: uniform_per_trial
  # Parameters specific to the chosen disorder type
  # Only parameters relevant to 'type' above will be used
  params:
    #mean_rest_prob: 0      # Example: Average resting probability
    #std_dev_rest_prob: 0.4   # Example: Standard deviation for the draw
    #max_allowed_rest_prob: 1 # Example: Max P_rest, ensures movement possible
    min_rest_prob: 0  # Example: Minimum resting probability (e.g., 10%)
    max_rest_prob: 1  # Example: Maximum resting probability (e.g., 60%)
    # Resting probabilities will be drawn uniformly between these two values.
    #strength: 0.7 #For bias toward origin and vortex
    #sigma: 0.4
    #max_rest_strength: 0.5 # For gaussian
    #rest_level: 0.2       # For uniform
    # plateau_radius: 0.1   # For plateau
    # max_rest: 0.8         # For plateau, exp, multi_center
    # decay_rate: 10.0      # For plateau, exp, multi_center, boundary
    # etc...

ctrw:
  enabled: false # Set to true to use CTRW
  # --- Alpha Configuration (NEW) ---
  alpha_function:
    # Type must be a key in AVAILABLE_ALPHA_FUNCTIONS in the script
    # Examples: constant, gaussian, linear_gradient
    type: constant
    # Parameters specific to the chosen alpha function type
    params:
      #center_alpha: 0.5
      #edge_alpha: 0.9
      #sigma: 0.3
      value: 0.7 # For constant_alpha
      #min_alpha: 0.3 # For linear_gradient_alpha
      #max_alpha: 0.9 # For linear_gradient_alpha
      #direction: 'x' # o 'y' For linear_gradient_alpha

animation:
  enabled: false
  save: false           # Save the animation file? If false, shows interactively.
  steps: 500            # Number of steps for the animation run
  walker_index: 0
  filename: 'walk_animation.gif' # Used only if save is true

histograms:
  enabled: false
  # List of simulation steps (integers) to generate histograms for
  steps_to_plot: [1000, 10000, 100000]